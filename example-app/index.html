<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>@capgo/capacitor-live-activities</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Live Activities demo</h1>
      <p class="lead">
        Delivery tracking sample using <code>@capgo/capacitor-live-activities</code> on iOS 16.1+.
      </p>
      <div class="status-grid">
        <div class="status-card"><h2>Support</h2><p id="support">Checking...</p></div>
        <div class="status-card"><h2>Active</h2><p id="count">0</p></div>
        <div class="status-card"><h2>Activity ID</h2><p id="activity-id" class="mono">None</p></div>
        <div class="status-card wide">
          <h2>ActivityKit push token</h2>
          <p id="push-token" class="mono small">Not available yet</p>
        </div>
      </div>
      <div class="actions">
        <button id="start">Start delivery</button>
        <button id="update" class="secondary">Update status</button>
        <button id="end" class="danger">End activity</button>
        <button id="refresh" class="secondary">Refresh</button>
        <button id="get-version" class="secondary">Plugin version</button>
      </div>
      <pre id="output">Waiting for data...</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
