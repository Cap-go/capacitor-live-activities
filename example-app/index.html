<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>@capgo/capacitor-live-activities</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-live-activities</h1>
      <p class="lead">Inspect Live Activities support and list active activities on iOS.</p>
      <div class="status-grid">
        <div class="status-card"><h2>Support</h2><p id="support">Checking...</p></div>
        <div class="status-card"><h2>Activities</h2><p id="count">Checking...</p></div>
      </div>
      <div class="actions">
        <button id="refresh">Refresh</button>
        <button id="get-version" class="secondary">Plugin Version</button>
      </div>
      <pre id="output">Waiting for data...</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
